name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          set +e
          set -o pipefail
          xcodebuild \
            -project CatPlayIOSRelay.xcodeproj \
            -scheme CatPlayIOSRelay \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then
            diagnostics=$(grep -E '(^|[[:space:]])(error:|fatal error:)|BUILD FAILED|The following build commands failed' xcodebuild.log | tail -n 80)
            if [ -z "$diagnostics" ]; then
              diagnostics=$(tail -n 80 xcodebuild.log)
            fi
            {
              printf '### Xcode build diagnostics\n\n```text\n'
              printf '%s\n' "$diagnostics"
              printf '```\n'
            } >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$diagnostics" | sed 's/^/::error::/'
          fi
          exit "$build_status"
